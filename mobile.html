<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1063/1063376.png">
    <title>매입매출 관리 (안드로이드 최적화판)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --blue: #2980b9; --red: #c0392b; --orange: #d35400; --light: #f4f6f8; --border: #dfe6e9; --green: #27ae60; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 15px; background: var(--light); font-size: 14px; color: #333; -webkit-tap-highlight-color: transparent; }
        
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        .header h1 { font-size: 20px; margin: 0; color: var(--primary); }
        
        .btn { border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; padding: 10px 15px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-refresh { background: var(--green); color: white; }
        
        .input-section { background: #fafbfc; padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-title { font-weight: bold; font-size: 16px; color: var(--primary); }
        .btn-cancel { background: #95a5a6; color: white; font-size: 12px; display: none; padding: 6px 10px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }
        
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 5px; }
        .form-control { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; background: white; }
        .form-control:focus { border-color: var(--primary); outline: none; }

        .btn-submit { background: var(--primary); color: white; font-size: 16px; padding: 15px; margin-top: 10px; }
        .btn-submit.editing { background: #e67e22; }
        
        .camera-wrapper { margin-top: 5px; }
        .btn-camera { background: #ecf0f1; color: var(--primary); border: 2px dashed #bdc3c7; padding: 12px; width: 100%; text-align: center; }
        .btn-camera.active { background: #e8f8f5; border-color: var(--green); color: var(--green); }
        #preview-area { display: none; text-align: center; margin-top: 10px; position: relative; background: #eee; border-radius: 8px; padding: 5px; }
        #preview-img { max-height: 200px; max-width: 100%; border-radius: 4px; }
        .btn-del-img { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 25px; height: 25px; border: none; cursor: pointer; }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: #f8f9fa; text-align: left; padding: 10px; font-size: 13px; color: #555; white-space: nowrap; border-bottom: 2px solid #eee; }
        td { border-bottom: 1px solid #eee; padding: 12px 10px; font-size: 14px; vertical-align: middle; }
        
        .col-sales { color: var(--blue); font-weight: bold; }
        .col-exp { color: var(--red); font-weight: bold; }
        .receipt-btn { background: #3498db; color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; text-decoration: none; display: inline-block; }
        
        .actions { white-space: nowrap; }
        .btn-edit { background: #f39c12; color: white; padding: 5px 8px; font-size: 12px; margin-right: 5px; }
        .btn-del { background: #e74c3c; color: white; padding: 5px 8px; font-size: 12px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            th, td { padding: 10px 5px; font-size: 13px; }
        }

        .loader-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white; }
        .spinner { width: 40px; height: 40px; border: 4px solid #fff; border-top: 4px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column; }
        .modal-content { max-width: 95%; max-height: 80%; object-fit: contain; }
        .close-modal { position: absolute; top: 30px; right: 20px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; padding: 20px; }
    </style>
</head>
<body>

<div id="loader" class="loader-overlay"><div class="spinner"></div><div>처리 중...</div></div>

<div class="container">
    <div class="header">
        <h1>📊 매입매출 관리</h1>
        <button class="btn btn-refresh" onclick="loadData()">🔄</button>
    </div>

    <div class="input-section">
        <div class="form-header">
            <span class="form-title" id="formTitle">📝 신규 등록</span>
            <button class="btn btn-cancel" id="btnCancel" onclick="cancelEdit()">취소</button>
        </div>
        
        <div class="input-grid">
            <div class="form-group"><label>날짜</label><input type="date" id="date" class="form-control"></div>
            <div class="form-group"><label>구분</label><select id="moneyType" class="form-control"><option value="variable">지출매입 (-)</option><option value="sales">매출 (+)</option><option value="fixed">고정매입 (-)</option></select></div>
            
            <div class="form-group"><label>금액 (원)</label><input type="tel" id="amount" placeholder="0" class="form-control"></div>
            <div class="form-group"><label>사용자</label><input type="text" id="user" placeholder="이름" class="form-control"></div>
            
            <div class="form-group full-width"><label>파트너사</label><input type="text" id="item" placeholder="예: Novacast, AP&T, IDRA" class="form-control"></div>
            
            <div class="form-group full-width"><label>고객사</label><input type="text" id="client" placeholder="거래처명" class="form-control"></div>
            
            <input type="hidden" id="location" value="">
            
            <div class="form-group"><label>형태</label><select id="payType" class="form-control"><option value="카드영수증">카드영수증</option><option value="계산서발행">계산서발행</option><option value="송금">송금</option><option value="현금">현금</option></select></div>
            <div class="form-group"><label>카드번호</label><input type="text" id="cardNo" placeholder="번호 (4자리)" class="form-control"></div>
            
            <div class="form-group full-width"><label>내역</label><input type="text" id="detail" placeholder="추가 설명 및 상세 내역" class="form-control"></div>

            <div class="camera-wrapper full-width">
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button class="btn btn-camera" id="btnCam" onclick="document.getElementById('fileInput').click()">📷 영수증 촬영 / 사진 선택</button>
                <div id="preview-area">
                    <img id="preview-img" src="">
                    <button class="btn-del-img" onclick="clearImg()">×</button>
                </div>
            </div>

            <button class="btn btn-submit full-width" id="btnSubmit" onclick="submitData()">등록하기</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>파트너사</th>
                    <th>금액</th>
                    <th>고객사</th>
                    <th>영수증</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="imageModal" class="modal" onclick="this.style.display='none'">
    <div class="close-modal">&times;</div>
    <img class="modal-content" id="modalImg">
</div>

<script>
    const SERVER_URL = "https://script.google.com/macros/s/AKfycbxAbo6PtrKdVUVY5Vy9hEtC7d5U51kYchvGesrq7OkxKe84JmQxeTESh84UITFFOI_x/exec";

    let db = [];
    let currentImgBase64 = null;
    let isEditing = false;
    let editId = null;

    window.onload = function() {
        document.getElementById('date').valueAsDate = new Date();
        loadData();
    };

    function loadData() {
        if(SERVER_URL.includes("여기에")) { alert("URL 주소를 확인해주세요."); return; }
        showLoader(true);
        fetch(SERVER_URL + "?action=read")
        .then(res => res.json())
        .then(data => {
            db = data;
            db.sort((a,b) => new Date(b.날짜) - new Date(a.날짜)); 
            renderTable();
            showLoader(false);
        })
        .catch(err => { alert("로드 실패: " + err); showLoader(false); });
    }

    function getSafeDate(dateStr) {
        if(!dateStr) return { full: "", short: "" };
        const d = new Date(dateStr);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        
        return {
            full: `${year}-${month}-${day}`, 
            short: `${month}-${day}`         
        };
    }

    function submitData() {
        const date = document.getElementById('date').value;
        const amount = document.getElementById('amount').value;
        const item = document.getElementById('item').value;

        if(!date || !amount || !item) { alert("날짜, 파트너사, 금액은 필수입니다."); return; }

        const entry = {
            id: isEditing ? editId : Date.now(),
            date: date,
            moneyType: document.getElementById('moneyType').value,
            amount: amount,
            user: document.getElementById('user').value,
            item: item,
            client: document.getElementById('client').value,
            location: "", 
            payType: document.getElementById('payType').value,
            cardNo: document.getElementById('cardNo').value,
            detail: document.getElementById('detail').value, 
            img: currentImgBase64
        };

        const url = isEditing ? (SERVER_URL + "?action=update") : SERVER_URL;

        showLoader(true);
        fetch(url, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(entry)
        })
        .then(() => {
            alert(isEditing ? "✅ 수정되었습니다." : "✅ 등록되었습니다.");
            cancelEdit();
            loadData();
        })
        .catch(err => { alert("오류: " + err); showLoader(false); });
    }

    function editRow(id) {
        const item = db.find(row => row.ID == id);
        if(!item) return;

        isEditing = true;
        editId = id;

        document.getElementById('date').value = getSafeDate(item.날짜).full;
        document.getElementById('moneyType').value = item.구분;
        document.getElementById('amount').value = item.금액;
        document.getElementById('user').value = item.사용자;
        document.getElementById('item').value = item.아이템; 
        document.getElementById('detail').value = item.상세내용; 
        document.getElementById('client').value = item.고객사;
        document.getElementById('location').value = ""; 
        document.getElementById('payType').value = item.형태;
        document.getElementById('cardNo').value = item.카드번호;

        document.getElementById('formTitle').innerText = "✏️ 내역 수정 중";
        document.getElementById('formTitle').style.color = "#e67e22";
        document.getElementById('btnSubmit').innerText = "수정 완료";
        document.getElementById('btnSubmit').classList.add('editing');
        document.getElementById('btnCancel').style.display = 'block';
        document.getElementById('btnCam').innerText = "📷 사진 변경 (선택)";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        isEditing = false;
        editId = null;
        currentImgBase64 = null;
        
        const ids = ['amount', 'item', 'detail', 'user', 'client', 'location', 'cardNo'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('date').valueAsDate = new Date();
        document.getElementById('payType').value = '카드영수증';
        
        clearImg();

        document.getElementById('formTitle').innerText = "📝 신규 등록";
        document.getElementById('formTitle').style.color = "#2c3e50";
        document.getElementById('btnSubmit').innerText = "등록하기";
        document.getElementById('btnSubmit').classList.remove('editing');
        document.getElementById('btnCancel').style.display = 'none';
    }

    function delEntry(id) {
        if(!confirm("정말 삭제하시겠습니까?")) return;
        showLoader(true);
        fetch(SERVER_URL + "?action=delete&id=" + id)
        .then(res => res.json())
        .then(() => { alert("삭제되었습니다."); loadData(); })
        .catch(() => { alert("오류"); showLoader(false); });
    }

    function renderTable() {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        db.forEach(item => {
            const val = parseInt(item.금액).toLocaleString();
            const dateShort = getSafeDate(item.날짜).short; 
            const typeClass = item.구분 === 'sales' ? 'col-sales' : 'col-exp';
            const clientName = item.고객사 || '-';
            
            let imgBtn = `<span style="color:#ccc">-</span>`;
            if(item.이미지URL && item.이미지URL.includes('drive.google.com')) {
                const idMatch = item.imagesURL ? null : item.이미지URL.match(/id=([^&]+)/);
                if(idMatch) {
                    const thumb = `https://drive.google.com/thumbnail?sz=w1000&id=${idMatch[1]}`;
                    imgBtn = `<a href="#" class="receipt-btn" onclick="openImageModal('${thumb}')">보기</a>`;
                }
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${dateShort}</td>
                <td>${item.아이템}<br><span style="font-size:11px; color:#888">${item.사용자}</span></td>
                <td class="${typeClass}">${val}</td>
                <td style="font-size:12px;">${clientName}</td>
                <td>${imgBtn}</td>
                <td class="actions">
                    <button class="btn btn-edit" onclick="editRow('${item.ID}')">수정</button>
                    <button class="btn btn-del" onclick="delEntry('${item.ID}')">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function handleFile(input) {
        if(input.files && input.files[0]) {
            showLoader(true);
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const cvs = document.createElement('canvas');
                    const ctx = cvs.getContext('2d');
                    
                    const maxW = 800;
                    let w = img.width;
                    let h = img.height;
                    
                    if(w > maxW) { 
                        h = Math.round(h * (maxW / w)); 
                        w = maxW; 
                    }
                    
                    cvs.width = w; 
                    cvs.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    currentImgBase64 = cvs.toDataURL('image/jpeg', 0.6);
                    
                    document.getElementById('preview-img').src = currentImgBase64;
                    document.getElementById('preview-area').style.display = 'block';
                    document.getElementById('btnCam').classList.add('active');
                    document.getElementById('btnCam').innerText = "✅ 사진 준비됨";
                    showLoader(false);
                };
                
                img.onerror = function() {
                    alert("이미지를 읽어오는데 실패했습니다. 일반 갤러리 앱에서 사진을 다시 선택해 보세요.");
                    showLoader(false);
                };
                
                img.src = e.target.result;
            };
            
            reader.onerror = function() {
                alert("파일 읽기 오류가 발생했습니다.");
                showLoader(false);
            };
            
            reader.readAsDataURL(file);
        }
    }

    function clearImg() {
        currentImgBase64 = null;
        document.getElementById('preview-area').style.display = 'none';
        document.getElementById('fileInput').value = '';
        document.getElementById('btnCam').classList.remove('active');
        document.getElementById('btnCam').innerText = "📷 영수증 촬영 / 사진 선택";
    }

    function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    function openImageModal(url) { 
        document.getElementById('imageModal').style.display = 'flex'; 
        document.getElementById('modalImg').src = url; 
    }
</script>

</body>
</html>
